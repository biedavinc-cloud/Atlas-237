<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0176d3" />
  <title>Hors ligne — Atlas CRM</title>
  <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
  <style>
    @font-face { font-family: 'Glacial Indifference'; font-weight: 400; font-display: swap; src: url('/fonts/GlacialIndifference-Regular.woff2') format('woff2'); }
    @font-face { font-family: 'Glacial Indifference'; font-weight: 700; font-display: swap; src: url('/fonts/GlacialIndifference-Bold.woff2') format('woff2'); }
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: 'Glacial Indifference', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #0f172a; background: #f4f6f9;
    }
    main { width: 100%; max-width: 440px; text-align: center; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 36px 28px; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px -12px rgba(15,23,42,.12); }
    .mark { width: 64px; height: 64px; margin: 0 auto 20px; position: relative; }
    .mark img { width: 64px; height: 64px; }
    .pulse { position: absolute; inset: -10px; border-radius: 999px; border: 2px solid #0176d3; opacity: .0; animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.7); opacity: .45; } 80%, 100% { transform: scale(1.25); opacity: 0; } }
    h1 { font-size: 24px; line-height: 1.25; margin: 0 0 10px; }
    p { margin: 0 0 8px; line-height: 1.6; color: #475569; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin: 14px 0 22px; font-size: 14px; color: #64748b; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: #f59e0b; }
    .online .dot { background: #16a34a; }
    button {
      appearance: none; border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 700;
      color: #fff; background: #0176d3; cursor: pointer; transition: background .15s;
    }
    button:hover { background: #014486; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .foot { margin-top: 18px; font-size: 13px; color: #94a3b8; }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="mark"><span class="pulse" aria-hidden="true"></span><img src="/icons/icon-192.png" alt="Atlas CRM" /></div>
      <h1 id="title">Vous êtes hors ligne</h1>
      <p id="body">Atlas a besoin d’internet pour afficher les données de votre entreprise. Rien n’est perdu : vos données restent en sécurité sur nos serveurs.</p>
      <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">En attente de connexion…</span></div>
      <div><button type="button" id="retry">Réessayer</button></div>
    </div>
    <p class="foot">Atlas CRM · Liafrik Tech · Dubaï – Yaoundé</p>
  </main>
  <script>
    (function () {
      var en = (navigator.language || '').toLowerCase().indexOf('fr') !== 0;
      if (en) {
        document.documentElement.lang = 'en';
        document.title = 'Offline — Atlas CRM';
        document.getElementById('title').textContent = 'You are offline';
        document.getElementById('body').textContent = 'Atlas needs an internet connection to show your company data. Nothing is lost: your data stays safe on our servers.';
        document.getElementById('status-text').textContent = 'Waiting for a connection…';
        document.getElementById('retry').textContent = 'Try again';
      }
      function reload() { location.reload(); }
      document.getElementById('retry').addEventListener('click', reload);
      window.addEventListener('online', function () {
        document.getElementById('status').className = 'status online';
        document.getElementById('status-text').textContent = en ? 'Back online, reloading…' : 'Connexion rétablie, rechargement…';
        setTimeout(reload, 600);
      });
    })();
  </script>
</body>
</html>
